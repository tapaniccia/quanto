name: Calendar notifications
on:
  # Enable the hourly schedule only after credentials, rules and device delivery are verified.
  # schedule:
  #   - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: calendar-notifications
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Send calendar notifications
        run: node src/send-notifications.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: 'https://tapaniccia.github.io/quanto/'
